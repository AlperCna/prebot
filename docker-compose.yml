# Production on a VPS:
#   1) cp deploy/.env.example .env   and fill it in (at least DOMAIN)
#   2) docker compose up -d --build
#   Discord bot too:  docker compose --profile discord up -d --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      Push__Subject: ${PUSH_SUBJECT:-mailto:prebot@example.com}
      # Leave empty to generate once and keep them in the data volume.
      Push__PublicKey: ${PUSH_PUBLIC_KEY:-}
      Push__PrivateKey: ${PUSH_PRIVATE_KEY:-}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__Discord__ClientId: ${DISCORD_CLIENT_ID:-}
      Authentication__Discord__ClientSecret: ${DISCORD_CLIENT_SECRET:-}
      # Discord bot inside the website (recommended): set DISCORD_BOT_TOKEN. Then do NOT also start the
      # separate "discord" profile below, or two bots would answer every command.
      Discord__Token: ${DISCORD_BOT_TOKEN:-}
      Discord__FeedChannels: ${DISCORD_FEED_CHANNELS:-}
      PublicUrl: https://${DOMAIN}
      # Shown in the privacy notice and contact page (KVKK data controller, Law 5651 contact).
      Site__OperatorName: ${SITE_OPERATOR_NAME:-}
      Site__ContactEmail: ${SITE_CONTACT_EMAIL:-}
      Site__HostingLocation: ${SITE_HOSTING_LOCATION:-}
      # Only Caddy (on this fixed network) may set X-Forwarded-For / X-Forwarded-Proto.
      ReverseProxy__KnownNetworks: 172.30.0.0/24
      # Optional dead-man's switch for the nightly backup (e.g. a Healthchecks.io ping URL).
      Backup__HeartbeatUrl: ${BACKUP_HEARTBEAT_URL:-}
    volumes:
      - prebot-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. prebot.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Standalone bot: only if the website does NOT host the bot.
  bot:
    profiles: ["discord"]
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    environment:
      # Not ":?" — compose would then demand it even when the bot profile is off. The bot itself
      # stops with a clear message if the token is missing.
      Discord__Token: ${DISCORD_BOT_TOKEN:-}
    volumes:
      - prebot-data:/data

volumes:
  prebot-data:
  caddy-data:
  caddy-config:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
