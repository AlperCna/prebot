name: CI

on:
  push:
    branches: [master, main, "feature/**"]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PreBot.sln

      - name: Build
        run: dotnet build PreBot.sln --no-restore -c Release -warnaserror

      - name: Check migrations are up to date
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/PreBot.Core --startup-project src/PreBot.Core --no-build --configuration Release

      - name: Test
        run: dotnet test PreBot.sln --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build web image
        run: docker build -f Dockerfile.web -t prebot-web:ci .

      - name: Build bot image
        run: docker build -f Dockerfile.bot -t prebot-bot:ci .

      - name: Smoke test web image
        run: |
          docker run -d --name web -p 8080:8080 prebot-web:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8080/health && break; sleep 2; done
          curl -fs http://localhost:8080/health
          curl -fs http://localhost:8080/ | grep -q "5. kişiyi"
          docker logs web
